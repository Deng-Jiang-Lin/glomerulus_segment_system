<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>肾小球分割系统 - 登录</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        /* 动态背景粒子效果 */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: 
                radial-gradient(circle at 20% 50%, rgba(120, 119, 198, 0.3) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(255, 119, 198, 0.3) 0%, transparent 50%),
                radial-gradient(circle at 40% 80%, rgba(120, 219, 226, 0.3) 0%, transparent 50%);
            animation: backgroundShift 10s ease-in-out infinite;
        }

        @keyframes backgroundShift {
            0%, 100% { transform: translateX(0) translateY(0) rotate(0deg); }
            33% { transform: translateX(30px) translateY(-30px) rotate(0.5deg); }
            66% { transform: translateX(-20px) translateY(20px) rotate(-0.5deg); }
        }

        /* 系统标题 */
        .system-title {
            position: absolute;
            top: 40px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 28px;
            font-weight: 600;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
            z-index: 10;
        }

        /* 登录容器 */
        .login-container {
            position: relative;
            z-index: 5;
            width: 100%;
            max-width: 420px;
            padding: 0 20px;
        }

        /* 登录卡片 */
        .login-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 
                0 20px 60px rgba(0, 0, 0, 0.1),
                0 8px 32px rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            animation: cardSlideIn 0.8s ease-out;
            transition: all 0.3s ease;
        }

        .login-card:hover {
            transform: translateY(-5px);
            box-shadow: 
                0 25px 80px rgba(0, 0, 0, 0.15),
                0 12px 40px rgba(0, 0, 0, 0.1);
        }

        @keyframes cardSlideIn {
            from {
                opacity: 0;
                transform: translateY(50px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* 卡片头部 */
        .login-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .login-header h2 {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }

        .login-subtitle {
            color: #6c757d;
            font-size: 14px;
            font-weight: 400;
        }

        /* 表单样式 */
        .form-group {
            margin-bottom: 24px;
            position: relative;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 500;
            color: #495057;
        }

        .input-container {
            position: relative;
        }

        .form-input {
            width: 100%;
            padding: 15px 20px;
            padding-left: 50px;
            border: 2px solid #e9ecef;
            border-radius: 12px;
            font-size: 16px;
            background: white;
            transition: all 0.3s ease;
            outline: none;
        }

        .form-input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
            transform: translateY(-2px);
        }

        /* 输入框图标 */
        .input-icon {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: #6c757d;
            font-size: 18px;
            transition: color 0.3s ease;
        }

        .form-input:focus + .input-icon {
            color: #667eea;
        }

        /* 记住我选项 */
        .remember-forgot {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            font-size: 14px;
        }

        .remember-me {
            display: flex;
            align-items: center;
            cursor: pointer;
        }

        .remember-me input {
            margin-right: 8px;
            accent-color: #667eea;
        }

        .forgot-password {
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .forgot-password:hover {
            color: #764ba2;
            text-decoration: underline;
        }

        /* 按钮样式 */
        .btn-group {
            display: flex;
            gap: 12px;
        }

        .login-btn {
            flex: 2;
            padding: 15px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .login-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.6s ease;
        }

        .login-btn:hover::before {
            left: 100%;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .demo-btn {
            flex: 1;
            padding: 15px 24px;
            background: white;
            color: #667eea;
            border: 2px solid #667eea;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .demo-btn:hover {
            background: #667eea;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.2);
        }

        /* 错误消息 */
        .error-message {
            background: #f8d7da;
            color: #721c24;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            border-left: 4px solid #dc3545;
            animation: errorSlideIn 0.3s ease-out;
            display: none;
        }

        @keyframes errorSlideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        /* 成功状态 */
        .success-card {
            text-align: center;
            padding: 40px;
        }

        .success-icon {
            font-size: 64px;
            color: #28a745;
            margin-bottom: 20px;
            animation: bounceIn 0.8s ease-out;
        }

        @keyframes bounceIn {
            0% { transform: scale(0.3); opacity: 0; }
            50% { transform: scale(1.05); }
            70% { transform: scale(0.9); }
            100% { transform: scale(1); opacity: 1; }
        }

        .success-title {
            font-size: 24px;
            font-weight: 600;
            color: #495057;
            margin-bottom: 12px;
        }

        .success-message {
            color: #6c757d;
            font-size: 16px;
            margin-bottom: 24px;
        }

        .redirect-info {
            background: #d4edda;
            color: #155724;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 14px;
            border-left: 4px solid #28a745;
        }

        /* 响应式设计 */
        @media (max-width: 480px) {
            .login-card {
                padding: 24px;
                margin: 20px;
            }
            
            .system-title {
                font-size: 24px;
                top: 20px;
            }
            
            .login-header h2 {
                font-size: 24px;
            }
            
            .btn-group {
                flex-direction: column;
            }
            
            .demo-btn {
                margin-top: 8px;
            }
        }

        /* 加载状态 */
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="system-title">肾小球图像分割系统</div>
    
    <div class="login-container">
        <div class="login-card" id="loginCard">
            <div class="login-header">
                <h2>用户登录</h2>
                <p class="login-subtitle">请输入您的账户信息</p>
            </div>

            <div class="error-message" id="errorMessage"></div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="username">用户名</label>
                    <div class="input-container">
                        <input type="text" id="username" name="username" class="form-input" placeholder="请输入用户名" required autofocus>
                        <div class="input-icon">👤</div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">密码</label>
                    <div class="input-container">
                        <input type="password" id="password" name="password" class="form-input" placeholder="请输入密码" required>
                        <div class="input-icon">🔒</div>
                    </div>
                </div>

                <div class="remember-forgot">
                    <label class="remember-me">
                        <input type="checkbox" id="rememberMe">
                        记住我
                    </label>
                    <a href="#" class="forgot-password">忘记密码？</a>
                </div>

                <div class="btn-group">
                    <button type="submit" class="login-btn" id="loginBtn">
                        <span id="loginBtnText">登录</span>
                    </button>
                    <button type="button" class="demo-btn" id="demoBtn">演示</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        (function(){
            const form = document.getElementById('loginForm');
            const errorMessage = document.getElementById('errorMessage');
            const demoBtn = document.getElementById('demoBtn');
            const loginBtn = document.getElementById('loginBtn');
            const loginBtnText = document.getElementById('loginBtnText');
            const loginCard = document.getElementById('loginCard');
            const usernameInput = document.getElementById('username');
            const passwordInput = document.getElementById('password');

            // 隐藏错误消息
            function hideError() {
                errorMessage.style.display = 'none';
                errorMessage.textContent = '';
            }

            // 显示错误消息
            function showError(message) {
                errorMessage.textContent = message;
                errorMessage.style.display = 'block';
                errorMessage.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }

            // 设置加载状态
            function setLoading(loading) {
                if (loading) {
                    loginBtn.disabled = true;
                    loginBtnText.innerHTML = '<div class="loading"></div>登录中...';
                } else {
                    loginBtn.disabled = false;
                    loginBtnText.textContent = '登录';
                }
            }

            // 演示按钮功能
            demoBtn.addEventListener('click', function(){
                usernameInput.value = 'admin';
                passwordInput.value = 'password123';
                
                // 添加一些视觉反馈
                [usernameInput, passwordInput].forEach(input => {
                    input.style.background = '#e8f5e8';
                    setTimeout(() => {
                        input.style.background = 'white';
                    }, 1000);
                });
            });

            // 输入框焦点事件
            [usernameInput, passwordInput].forEach(input => {
                input.addEventListener('focus', hideError);
                
                input.addEventListener('input', function() {
                    if (this.value.trim()) {
                        this.style.borderColor = '#28a745';
                    }
                });
            });

            // 表单提交
            form.addEventListener('submit', async function(ev){
                ev.preventDefault();
                hideError();
                
                const username = usernameInput.value.trim();
                const password = passwordInput.value.trim();

                // 基础验证
                if (!username) {
                    showError('请输入用户名');
                    usernameInput.focus();
                    return;
                }

                if (!password) {
                    showError('请输入密码');
                    passwordInput.focus();
                    return;
                }

                setLoading(true);

                try {
                    const formData = new FormData(form);
                    const response = await fetch('/login', {
                        method: 'POST', 
                        body: formData
                    });
                    
                    const data = await response.json();
                    
                    if (response.ok && data.ok) {
                        // 登录成功
                        showSuccessPage(data.user || username);
                    } else {
                        showError(data.error || '登录失败，请检查用户名和密码');
                    }
                } catch (error) {
                    console.error('登录错误:', error);
                    showError('网络连接失败，请稍后重试');
                } finally {
                    setLoading(false);
                }
            });

            // 显示成功页面
            function showSuccessPage(username) {
                loginCard.innerHTML = `
                    <div class="success-card">
                        <div class="success-icon">✅</div>
                        <h2 class="success-title">登录成功！</h2>
                        <p class="success-message">欢迎回来，${username}</p>
                        <div class="redirect-info">
                            <div>正在跳转到系统主页...</div>
                            <div style="margin-top: 8px;">
                                <div class="loading"></div>
                                <span style="font-size: 12px;">3秒后自动跳转</span>
                            </div>
                        </div>
                    </div>
                `;

                // 3秒后跳转到主页
                setTimeout(() => {
                    window.location.href = '/';
                }, 3000);
            }

            // 回车键快捷登录
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' && !loginBtn.disabled) {
                    form.dispatchEvent(new Event('submit'));
                }
            });
        })();
    </script>
</body>
</html>
