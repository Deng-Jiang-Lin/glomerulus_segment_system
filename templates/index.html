<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>病变宫颈细胞智能检测系统</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="head">病变宫颈细胞智能检测系统</div>
<div class="container">
    <div class="images">
        <div class="uploaded-img">
            <div class="img-title">病理图片</div>
            <div class="img-placeholder"></div>
        </div>
        <div class="segmented-img">
            <div class="img-title">检测结果</div>
            <div class="img-placeholder"></div>
        </div>
    </div>
    <div class="actions-row">
        <div class="btn-group">
            <button id="userMgmtBtn" class="action-btn">用户管理</button>
            <button id="settings" class="action-btn">配置</button>
            <button id="uploadBtn" class="action-btn">上传</button>
            <button id="detectmentBtn" class="action-btn">检测</button>
            <button id="downloadBtn" class="action-btn">下载</button>
            <button id="history" class="action-btn">历史记录</button>
        </div>
    </div>
</div>
<div class="foot">
</div>
<div id="toast" aria-live="polite"
     style="position:fixed;top:18px;right:18px;z-index:9999;display:none;max-width:320px;box-shadow:0 6px 18px rgba(0,0,0,0.14);border-radius:8px;overflow:hidden;font-family:Segoe UI,Arial,sans-serif"></div>
<script>
    (function () {
        const uploadBtn = document.getElementById('uploadBtn');
        const toastEl = document.getElementById('toast');
        const uploadedContainer = document.querySelector('.uploaded-img .img-placeholder');
        function setToast(text, level = 'info', timeout = 4000) {
            const bg = (level === 'error') ? '#fef0f0' : (level === 'success' ? '#f0fff4' : '#ffffff');
            const color = (level === 'error') ? '#8b1e1e' : (level === 'success' ? '#1e6b32' : '#333');
            toastEl.innerHTML = `<div style="padding:12px 14px;background:${bg};color:${color}">
                <div style="font-weight:600;margin-bottom:6px">${escapeHtml(level.toUpperCase())}</div>
                <div style="font-size:13px;line-height:1.3">${escapeHtml(text)}</div>
            </div>`;
            toastEl.style.display = 'block';
            if (timeout > 0) {
                clearTimeout(toastEl._t);
                toastEl._t = setTimeout(() => {
                    toastEl.style.display = 'none';
                }, timeout);
            }
        }
        function escapeHtml(s) {
            if (!s) return '';
            return String(s).replace(/[&<>"']/g, function (c) {
                return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": "&#39;"}[c];
            });
        }
        const fileInput = document.createElement('input');
        fileInput.type = 'file';
        fileInput.style.display = 'none';
        document.body.appendChild(fileInput);
        uploadBtn.addEventListener('click', function () {
            fileInput.click();
        });
        fileInput.addEventListener('change', function () {
    if (fileInput.files.length === 0) return;
    
    const file = fileInput.files[0];
    const formData = new FormData();
    formData.append('file', file);
    
    setToast('开始处理...', 'info');
    
    fetch('/upload', {
        method: 'POST',
        body: formData
    })
    .then(r => r.text().then(text => ({ ok: r.ok, status: r.status, text })))
    .then(obj => {
        if (obj.ok) {
            try {
                handleSuccess(obj.text);
            } catch (e) {
                console.log(e);
                setToast('处理失败：' + e, 'error');
            }
        } else {
            setToast('请求失败: HTTP ' + obj.status + ' — ' + obj.text, 'error');
        }
    })
    .catch(err => setToast('请求失败: ' + err, 'error'))
    .finally(() => {
        // 清空 input，允许重新选择同一个文件
        fileInput.value = '';
        });
    });
        const detectmentBtn = document.getElementById('detectmentBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const segmentedPlaceholder = document.querySelector('.segmented-img .img-placeholder');
        detectmentBtn.addEventListener('click', function () {
        setToast('开始检测...', 'info', 0);
        fetch('/segment', {
            method: 'POST'
        })
        .then(res => res.json())
        .then(data => {
            if (!data.result_path) {
                throw new Error('接口未返回 result_path');
            }
            setToast('检测完成', 'success');
            const img = document.createElement('img');
            img.src = data.result_path + '?t=' + Date.now(); 
            img.alt = 'segmentation result';
            segmentedPlaceholder.innerHTML = '';
            segmentedPlaceholder.appendChild(img);
            downloadBtn.onclick = () => {
                window.open(data.result_path, '_blank');
            };
                })
                .catch(err => {
                    console.error(err);
                    setToast('检测失败', 'error');
                })
                .finally(() => {
                    setTimeout(() => {
                        toastEl.style.display = 'none';
                    }, 5000);
                });
            });

        function handleSuccess(responseText) {
            let data = null;
            try {
                data = JSON.parse(responseText);
            } catch (e) {
                setToast('上传成功（服务器未返回 JSON）：' + responseText);
                tryLocalPreview();
                return;
            }

            let filename = data.image_url || 'unknown';
            console.log(filename)
            window.lastUploadedFilename = filename;
            const serverUrl = filename
            const img = document.createElement('img');
            img.alt = 'uploaded image';
            img.src = serverUrl;
            img.onload = function () {
                uploadedContainer.innerHTML = '';
                uploadedContainer.appendChild(img);
            };
            img.onerror = function () {
                tryLocalPreview();
            };
            function tryLocalPreview() {
                try {
                    const url = filename
                    uploadedContainer.innerHTML = '';
                    const limg = document.createElement('img');
                    limg.src = url;
                    limg.alt = 'uploaded image';
                    uploadedContainer.appendChild(limg);
                } catch (e) {
                    console.warn('无法创建本地预览：', e);
                }
            }
        }

        const settingsBtn = document.getElementById('settings');

        const configModalHtml = `
<div id="configModal" style="position:fixed;left:0;top:0;width:100%;height:100%;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,0.45);z-index:10000">

          </tr>

        <tbody id="modelsTableBody"></tbody>
      </table>

    <!-- 上传新模型区域 -->
    <div style="margin-top:20px;padding:16px;background:#f8f9fa;border-radius:8px;border:2px dashed #dee2e6">
      <h4 style="margin:0 0 12px 0;color:#495057">上传新模型</h4>
      <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
        <input type="file" id="modelFileInput" accept=".pt,.pth" style="padding:8px;border:1px solid #ced4da;border-radius:4px;background:#fff" />
        <button id="uploadModelBtn" class="action-btn" style="background:#28a745;color:#fff;padding:10px 20px;border:none;border-radius:6px;cursor:pointer;font-weight:500">
          <span>📤</span> 上传模型
        </button>
        <div style="flex:1"></div>
        <button id="refreshModelsBtn" class="action-btn" style="background:#17a2b8;color:#fff;padding:10px 16px;border:none;border-radius:6px;cursor:pointer">
          <span>🔄</span> 刷新
        </button>
      </div>
    </div>
  </div>
</div>
`;

        document.body.insertAdjacentHTML('beforeend', configModalHtml);
        const configModal = document.getElementById('configModal');
        const closeConfigBtn = document.getElementById('closeConfigBtn');
        const modelsTableBody = document.getElementById('modelsTableBody');
        const modelFileInput = document.getElementById('modelFileInput');
        const uploadModelBtn = document.getElementById('uploadModelBtn');
        const refreshModelsBtn = document.getElementById('refreshModelsBtn');
        const totalModelsCount = document.getElementById('totalModelsCount');
        const activeModelCount = document.getElementById('activeModelCount');
        const totalSizeDisplay = document.getElementById('totalSizeDisplay');

        settingsBtn.addEventListener('click', function(){
            configModal.style.display = 'flex';
            loadConfigModels();
        });

        closeConfigBtn.addEventListener('click', function(){ 
            configModal.style.display='none'; 
        });

        refreshModelsBtn.addEventListener('click', function(){
            loadConfigModels();
        });

        function loadConfigModels(){
            modelsTableBody.innerHTML = '<tr><td colspan="8" style="padding:20px;text-align:center;color:#6c757d"><div style="font-size:16px">⏳ 加载模型信息中...</div></td></tr>';
            
            fetch('/models').then(r=>r.json()).then(data=>{
                const models = data.models || [];
                const selectedModel = data.selected || '';
                
                // 更新统计信息
                totalModelsCount.textContent = models.length;
                activeModelCount.textContent = selectedModel ? '1' : '0';
                
                // 计算总大小
                let totalSize = 0;
                models.forEach(model => {
                    if (model.size_mb && typeof model.size_mb === 'number') {
                        totalSize += model.size_mb;
                    }
                });
                totalSizeDisplay.textContent = totalSize > 1024 ? 
                    (totalSize / 1024).toFixed(2) + ' GB' : 
                    totalSize.toFixed(2) + ' MB';
                
                modelsTableBody.innerHTML = '';
                
                if (models.length === 0) {
                    modelsTableBody.innerHTML = '<tr><td colspan="8" style="padding:30px;text-align:center;color:#6c757d"><div style="font-size:16px">📁 暂无模型文件</div><div style="font-size:14px;margin-top:8px;color:#adb5bd">请上传模型文件开始使用</div></td></tr>';
                    return;
                }
                
                models.forEach((model, idx) => {
                    const tr = document.createElement('tr');
                    tr.style.borderBottom = '1px solid #e9ecef';
                    tr.style.transition = 'background-color 0.2s';
                    tr.onmouseover = function() { this.style.backgroundColor = '#f8f9fa'; };
                    tr.onmouseout = function() { this.style.backgroundColor = ''; };
                    
                    // 处理模型信息，如果是字符串则作为文件名处理
                    let modelInfo = {};
                    if (typeof model === 'string') {
                        modelInfo = {
                            name: model,
                            id: idx + 1,
                            version: 'v1.0',
                            size_mb: 0,
                            upload_time: '未知',
                            type: model.includes('unet') ? 'U-Net' : '通用',
                            status: selectedModel === model ? '激活' : '可用'
                        };
                    } else {
                        modelInfo = {
                            name: model.name || `模型${idx + 1}`,
                            id: model.id || (idx + 1),
                            version: model.version || 'v1.0',
                            size_mb: model.size_mb || 0,
                            upload_time: model.upload_time || '未知',
                            type: model.type || (model.name && model.name.includes('unet') ? 'U-Net' : '通用'),
                            status: selectedModel === (model.name || model) ? '激活' : '可用'
                        };
                    }
                    
                    const sizeStr = modelInfo.size_mb > 0 ? 
                        (modelInfo.size_mb > 1024 ? 
                            (modelInfo.size_mb / 1024).toFixed(2) + ' GB' : 
                            modelInfo.size_mb.toFixed(2) + ' MB') 
                        : '未知';
                    
                    const statusHtml = modelInfo.status === '激活' ? 
                        '<span style="background:#28a745;color:#fff;padding:4px 8px;border-radius:12px;font-size:12px;font-weight:500">🟢 激活中</span>' :
                        '<span style="background:#6c757d;color:#fff;padding:4px 8px;border-radius:12px;font-size:12px;font-weight:500">⚪ 可用</span>';
                    
                    const actionBtns = `
                        <button class='chooseModelBtn' data-name='${model.name || model}' 
                                style='background:#007bff;color:#fff;border:none;padding:6px 12px;margin-right:6px;border-radius:4px;cursor:pointer;font-size:12px'>
                            ${modelInfo.status === '激活' ? '✅ 已选择' : '🔄 选择'}
                        </button>
                        <button class='deleteModelBtn' data-name='${model.name || model}'
                                style='background:#dc3545;color:#fff;border:none;padding:6px 12px;border-radius:4px;cursor:pointer;font-size:12px'
                                onclick='return confirm("确定要删除模型 ${modelInfo.name} 吗？")'>
                            🗑️ 删除
                        </button>
                    `;
                    
                    const cols = [
                        modelInfo.id,
                        `<div style="font-weight:600;color:#2c3e50">${modelInfo.name}</div>`,
                        modelInfo.version,
                        sizeStr,
                        modelInfo.upload_time,
                        modelInfo.type,
                        statusHtml,
                        actionBtns
                    ];
                    
                    cols.forEach(content => {
                        const td = document.createElement('td');
                        td.style.padding = '12px 8px';
                        td.style.verticalAlign = 'middle';
                        td.innerHTML = content;
                        tr.appendChild(td);
                    });
                    
                    modelsTableBody.appendChild(tr);
                });

                // 重新绑定按钮事件
                bindModelActionButtons();

            }).catch(e => { 
                console.error('加载模型失败:', e);
                modelsTableBody.innerHTML = '<tr><td colspan="8" style="padding:30px;text-align:center;color:#dc3545"><div style="font-size:16px">❌ 加载模型信息失败</div><div style="font-size:14px;margin-top:8px;">请检查网络连接后重试</div></td></tr>';
                // 重置统计信息
                totalModelsCount.textContent = '-';
                activeModelCount.textContent = '-';
                totalSizeDisplay.textContent = '-';
            });
        }

        function bindModelActionButtons() {
            // 选择模型按钮
            Array.from(modelsTableBody.querySelectorAll('.chooseModelBtn')).forEach(btn => {
                btn.addEventListener('click', function(){
                    const modelName = this.dataset.name;
                    this.textContent = '⏳ 切换中...';
                    this.disabled = true;
                    
                    fetch('/select_model', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({name: modelName})
                    })
                    .then(r => r.json())
                    .then(res => {
                        if(res.selected) {
                            setToast('✅ 模型已切换至: ' + res.selected, 'success');
                            loadConfigModels(); // 重新加载以更新状态
                        } else {
                            throw new Error('切换失败');
                        }
                    })
                    .catch(e => {
                        console.error('切换模型失败:', e);
                        setToast('❌ 切换模型失败: ' + e.message, 'error');
                        this.textContent = '🔄 选择';
                        this.disabled = false;
                    });
                });
            });

            // 删除模型按钮
            Array.from(modelsTableBody.querySelectorAll('.deleteModelBtn')).forEach(btn => {
                btn.addEventListener('click', function(){
                    const modelName = this.dataset.name;
                    this.textContent = '⏳ 删除中...';
                    this.disabled = true;
                    
                    fetch('/delete_model', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({name: modelName})
                    })
                    .then(r => r.json())
                    .then(res => {
                        if(res.deleted) {
                            setToast('✅ 已删除模型: ' + modelName, 'success');
                            loadConfigModels(); // 重新加载
                        } else {
                            throw new Error('删除失败');
                        }
                    })
                    .catch(e => {
                        console.error('删除模型失败:', e);
                        setToast('❌ 删除模型失败: ' + e.message, 'error');
                        this.textContent = '🗑️ 删除';
                        this.disabled = false;
                    });
                });
            });
        }
        uploadModelBtn.addEventListener('click', function(){
            const f = modelFileInput.files && modelFileInput.files[0];
            if(!f){ setToast('请选择 .pt 文件再上传','error'); return; }
            const form = new FormData(); form.append('file', f);
            fetch('/upload_model',{method:'POST', body: form}).then(r=>r.json()).then(res=>{
                if(res.name) { setToast('模型上传成功: '+res.name,'success'); loadConfigModels(); }
                else setToast('上传失败','error');
            }).catch(e=> setToast('上传失败: '+e,'error'));
        });

        // 用户管理功能
        const userMgmtBtn = document.getElementById('userMgmtBtn');
        
        // 模拟用户数据（已更新）
        let mockUsers = [

        // 创建用户管理弹窗
        const userManagementModalHtml = `
<div id="userManagementModal" style="position:fixed;left:0;top:0;width:100%;height:100%;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,0.45);z-index:10000">
    <div style="background:#fff;padding:24px;border-radius:12px;min-width:1200px;max-width:95%;font-size:16px;box-shadow:0 4px 20px rgba(0,0,0,0.15);">

    <!-- 用户统计信息 -->

                    '<span style="background:#f39c12;color:#fff;padding:4px 8px;border-radius:12px;font-size:12px;font-weight:600">⏳ 处理中</span>';
                
                const actionBtns = `
                    <button class='downloadRecordBtn' data-url='${record.download_url}' data-name='${record.name}' 
                            style='background:#17a2b8;color:#fff;border:none;padding:6px 12px;margin-right:6px;border-radius:4px;cursor:pointer;font-size:12px'>
                        💾 下载
                    </button>
                    <button class='deleteRecordBtn' data-id='${record.id}'
                            style='background:#ff6b6b;color:#fff;border:none;padding:6px 12px;border-radius:4px;cursor:pointer;font-size:12px'
                            onclick='return confirm("确定要删除记录 ${record.name} 吗？")'>
                        🗑️ 删除
                    </button>
                `;
                
                const cols = [
                    record.id,
                    `<div style="font-weight:600;color:#2c3e50;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${record.name}">${record.name}</div>`,
                    record.completion_time,
                    `<span style="color:#007bff;font-weight:500">${record.duration}</span>`,
                    statusHtml,
                    actionBtns
                ];
                
                cols.forEach(content => {
                    const td = document.createElement('td');
                    td.style.padding = '12px 8px';
                    td.style.verticalAlign = 'middle';
                    td.innerHTML = content;
                    tr.appendChild(td);
                });
                
                historyTableBody.appendChild(tr);
            });
            
            // 绑定历史记录操作按钮事件
            bindHistoryActionButtons();
        }
        
        // 绑定历史记录操作按钮事件
        function bindHistoryActionButtons() {
            // 下载按钮
            Array.from(historyTableBody.querySelectorAll('.downloadRecordBtn')).forEach(btn => {
                btn.addEventListener('click', function(){
                    const downloadUrl = this.dataset.url;
                    const fileName = this.dataset.name;
                    downloadRecord(downloadUrl, fileName);
                });
            });
            
            // 删除按钮
            Array.from(historyTableBody.querySelectorAll('.deleteRecordBtn')).forEach(btn => {
                btn.addEventListener('click', function(){
                    const recordId = parseInt(this.dataset.id);
                    deleteRecord(recordId);
                });
            });
        }
        
        // 下载记录
        function downloadRecord(downloadUrl, fileName) {
            try {
                // 创建一个临时的下载链接
                const link = document.createElement('a');
                link.href = downloadUrl;
                link.download = fileName.replace('.jpg', '_result.jpg');
                link.style.display = 'none';
                
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                
                setToast(`📥 开始下载: ${fileName}`, 'success');
            } catch (error) {
                console.error('下载失败:', error);
                setToast('❌ 下载失败，请检查文件是否存在', 'error');
            }
        }
        
        // 删除记录
        function deleteRecord(recordId) {
            const recordIndex = mockHistoryRecords.findIndex(record => record.id === recordId);
            if (recordIndex === -1) {
                setToast('❌ 找不到记录信息', 'error');
                return;
            }
            
            const recordName = mockHistoryRecords[recordIndex].name;
            mockHistoryRecords.splice(recordIndex, 1);
            
            setToast(`✅ 记录 ${recordName} 已删除`, 'success');
            loadHistoryRecords();
        }
        
        // 添加新的历史记录（当完成检测时调用）
        function addHistoryRecord(name, duration) {
            const newRecord = {
                id: Math.max(...mockHistoryRecords.map(r => r.id), 0) + 1,
                name: name,
                completion_time: new Date().toLocaleString('zh-CN', {
                    year: 'numeric',
                    month: '2-digit',
                    day: '2-digit',
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit'
                }).replace(/\//g, '-'),
                duration: duration,
                download_url: `/results/${name.replace('.jpg', '_result.jpg')}`,
                status: "已完成"
            };
            
            mockHistoryRecords.unshift(newRecord); // 添加到数组开头
            
            // 如果记录太多，保留最近的100条
            if (mockHistoryRecords.length > 100) {
                mockHistoryRecords = mockHistoryRecords.slice(0, 100);
            }
        }
        
        // 集成到现有检测功能中（修改现有的检测按钮处理）
        const originaldetectmentBtnHandler = detectmentBtn.onclick;
        detectmentBtn.onclick = null;
        detectmentBtn.addEventListener('click', function () {
            const startTime = performance.now();
            setToast('开始检测...', 'info', 0);
            fetch('/detect', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ filename: window.lastUploadedFilename })
            })
            .then(res => res.json())
            .then(data => {
                if (!data.result_path) {
                    throw new Error('接口未返回 result_path');
                }

                const endTime = performance.now();
                const duration = ((endTime - startTime) / 1000).toFixed(1) + '秒';
                
                setToast('检测完成', 'success');

                const img = document.createElement('img');
                img.src = data.result_path + '?t=' + Date.now();
                img.alt = 'segmentation result';

                segmentedPlaceholder.innerHTML = '';
                segmentedPlaceholder.appendChild(img);

                downloadBtn.onclick = () => {
                    window.open(data.result_path, '_blank');
                };
                
                // 添加到历史记录
                const fileName = window.lastUploadedFilename || '未知文件.jpg';
                addHistoryRecord(fileName, duration);

            })
            .catch(err => {
                console.error(err);
                setToast('检测失败', 'error');
            })
            .finally(() => {
                setTimeout(() => {
                    toastEl.style.display = 'none';
                }, 5000);
            });
        });
    })();
</script>

</body>
</html>
